<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalahMaster — Interactive Prayer Learning Sanctuary</title>
  <meta name="description" content="Master Islamic prayer (Salah) with interactive lessons, audio recitations, posture guides, and progress tracking. From Wudu to completion.">
  <meta property="og:title" content="SalahMaster — Interactive Prayer Learning">
  <meta property="og:description" content="Master Salah with interactive lessons, audio, and progress tracking.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#065f46">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --emerald: #065f46; --emerald-light: #059669; --emerald-dark: #022c22;
      --gold: #d4a017; --gold-light: #f0c940; --cream: #fefce8;
      --text: #1a1a2e; --text-dim: #6b7280;
      --radius: 16px; --radius-sm: 8px; --radius-xl: 24px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      background-image: radial-gradient(circle at 20% 30%, rgba(6,95,70,0.04) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(212,160,23,0.04) 0%, transparent 40%);
      color: var(--text); min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    .header {
      background: linear-gradient(135deg, var(--emerald-dark), var(--emerald), var(--emerald-light));
      color: white; padding: 50px 0; text-align: center; position: relative; overflow: hidden;
    }
    .header::before {
      content: 'الصلاة'; position: absolute; top: 20px; right: 40px;
      font-family: 'Amiri', serif; font-size: 7rem; opacity: 0.04;
    }
    .header h1 {
      font-family: 'Amiri', serif; font-size: 3rem; margin-bottom: 8px;
    }
    .header p { opacity: 0.9; font-size: 1.05rem; }

    .bismillah {
      font-family: 'Amiri', serif; font-size: 1.8rem; text-align: center;
      color: var(--gold); margin: 24px 0 12px; opacity: 0.7;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex; justify-content: center; gap: 32px; flex-wrap: wrap;
      background: white; border-radius: var(--radius); padding: 20px 32px;
      margin: 20px 0 32px; box-shadow: var(--shadow);
    }
    .stat-item { text-align: center; }
    .stat-item .num { font-size: 1.5rem; font-weight: 800; color: var(--emerald); }
    .stat-item .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    /* Pyramid Levels */
    .pyramid {
      display: flex; flex-direction: column; align-items: center; gap: 20px; perspective: 1000px;
    }
    .pyramid-row { display: flex; justify-content: center; width: 100%; gap: 16px; }
    .pyramid-card {
      flex: 1; max-width: 320px; background: white; border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 28px; text-align: center; cursor: pointer;
      transition: var(--transition); border: 2px solid transparent; position: relative;
    }
    .pyramid-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
    .pyramid-card.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,0.15); }
    .pyramid-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.6); }
    .pyramid-card.locked:hover { transform: none; }

    .pyramid-card .ring-wrap { margin: 0 auto 16px; position: relative; width: 72px; height: 72px; }
    .pyramid-card .ring-wrap svg { width: 72px; height: 72px; transform: rotate(-90deg); }
    .pyramid-card .ring-wrap .bg { fill: none; stroke: #f3f4f6; stroke-width: 6; }
    .pyramid-card .ring-wrap .fg { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
    .pyramid-card .ring-wrap .pct-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; }

    .pyramid-card h3 { font-family: 'Amiri', serif; font-size: 1.5rem; margin-bottom: 6px; color: var(--emerald); }
    .pyramid-card .level-sub { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .pyramid-card p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; }
    .pyramid-card .lessons-count { font-size: 0.8rem; color: var(--text-dim); }
    .pyramid-card .lock-icon { font-size: 1.5rem; margin-bottom: 8px; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(4, 47, 46, 0.6);
      backdrop-filter: blur(12px); z-index: 1000; justify-content: center; align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--cream); border-radius: var(--radius-xl); max-width: 900px;
      width: 100%; max-height: 90vh; overflow-y: auto; position: relative;
      box-shadow: 0 40px 80px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2);
      animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .modal-close {
      position: sticky; top: 16px; float: right; margin-right: 20px; z-index: 10;
      width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.1);
      border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); color: var(--text);
    }
    .modal-close:hover { background: rgba(0,0,0,0.2); }

    .modal-body { padding: 40px; }

    .modal-body h2 { font-family: 'Amiri', serif; font-size: 2rem; color: var(--emerald); margin-bottom: 8px; }
    .modal-body .modal-desc { color: var(--text-dim); margin-bottom: 20px; }

    /* Lesson tabs inside modal */
    .lesson-tabs {
      display: flex; gap: 4px; background: white; border-radius: var(--radius-sm);
      padding: 5px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .lesson-tab {
      flex: 1; min-width: 80px; text-align: center; padding: 10px 14px;
      border: none; background: transparent; font-family: 'Inter', sans-serif;
      font-size: 0.85rem; font-weight: 600; color: var(--text-dim); border-radius: 6px;
      cursor: pointer; transition: var(--transition);
    }
    .lesson-tab:hover { background: rgba(6,95,70,0.04); }
    .lesson-tab.active { background: var(--emerald); color: white; }

    .lesson-panel { display: none; animation: fade-up 0.3s ease; }
    .lesson-panel.active { display: block; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Content styles */
    .posture-card {
      background: white; border-radius: var(--radius); padding: 28px;
      margin-bottom: 20px; border: 1px solid #e5e7eb; transition: var(--transition);
    }
    .posture-card:hover { border-color: var(--gold); }

    .posture-card .posture-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    }
    .posture-card .posture-num {
      width: 36px; height: 36px; background: var(--emerald); color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
    }
    .posture-card h3 { font-size: 1.2rem; font-weight: 700; }

    .arabic-recitation {
      font-family: 'Amiri', serif; font-size: 2rem; text-align: right; direction: rtl;
      color: var(--emerald); margin: 16px 0; line-height: 1.6;
    }
    .transliteration { font-style: italic; color: var(--gold); font-size: 0.95rem; margin-bottom: 8px; }
    .translation { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; margin-bottom: 12px; }

    .tip-box {
      background: rgba(212, 160, 23, 0.06); border-left: 4px solid var(--gold);
      padding: 16px 20px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 12px 0;
    }
    .tip-box h4 { font-size: 0.9rem; color: var(--gold); margin-bottom: 6px; }
    .tip-box p { font-size: 0.85rem; color: var(--text-dim); }

    .btn-audio {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
      background: var(--emerald); color: white; border: none; border-radius: 50px;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); margin: 8px 0;
    }
    .btn-audio:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(6,95,70,0.3); }
    .btn-audio.playing { background: var(--gold); }

    .posture-svg { width: 100px; height: auto; opacity: 0.9; border-radius: 8px; }
    @media (max-width: 600px) { .posture-svg { width: 70px; } }

    .btn {
      padding: 12px 24px; border: none; border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: var(--transition);
    }
    .btn-primary { background: var(--emerald); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(6,95,70,0.3); }
    .btn-secondary { background: white; border: 1px solid #d1d5db; color: var(--text); }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--text); }

    .lesson-nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; border-top: 1px solid #e5e7eb; margin-top: 20px;
    }
    .lesson-progress {
      flex: 1; height: 6px; background: #e5e7eb; border-radius: 3px; margin: 0 20px; overflow: hidden;
    }
    .lesson-progress .fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--gold)); border-radius: 3px; transition: width 0.4s ease; }

    /* Quiz */
    .quiz-card {
      background: white; border-radius: var(--radius); padding: 24px;
      border: 1px solid #e5e7eb; margin-bottom: 12px;
    }
    .quiz-card p { font-weight: 600; margin-bottom: 12px; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quiz-opt {
      padding: 12px; border: 1px solid #d1d5db; border-radius: var(--radius-sm);
      background: white; cursor: pointer; transition: var(--transition);
      font-family: 'Inter', sans-serif; font-size: 0.9rem;
    }
    .quiz-opt:hover { border-color: var(--emerald); }
    .quiz-opt.correct { border-color: var(--green); background: rgba(6,95,70,0.06); color: var(--emerald); }
    .quiz-opt.wrong { border-color: #ef4444; background: rgba(239,68,68,0.06); color: #ef4444; }

    footer {
      text-align: center; padding: 40px; color: var(--text-dim);
      font-size: 0.85rem; border-top: 1px solid #e5e7eb; margin-top: 60px;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2.2rem; }
      .pyramid-row { flex-direction: column; align-items: center; }
      .pyramid-card { max-width: 100%; }
      .modal-body { padding: 24px; }
      .quiz-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>SalahMaster</h1>
      <p>A sacred sanctuary for mastering the dialogue of Salah — step by step, posture by posture.</p>
    </div>
  </header>

  <div class="container">
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

    <div class="stats-bar">
      <div class="stat-item"><div class="num" id="lessons-done">0</div><div class="label">Lessons Done</div></div>
      <div class="stat-item"><div class="num" id="quiz-score">0</div><div class="label">Quiz Score</div></div>
      <div class="stat-item"><div class="num" id="streak">0</div><div class="label">Day Streak</div></div>
    </div>

    <div class="pyramid" id="pyramid-container"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>SalahMaster — May your prayer be accepted. 🤲</p>
  </footer>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    const levels = [
      { id: 1, title: 'Purification', subtitle: 'Wudu & Cleanliness', icon: '💧', desc: 'Learn the essential purifications before Salah.',
        unlocked: true, lessons: [
          { title: 'Wudu (Ablution)', objectives: ['Understand the steps of Wudu', 'Learn the dua after Wudu', 'Know what breaks Wudu'],
            content: `Wudu (ablution) is the ritual purification required before Salah. Allah says: "O you who believe! When you rise to pray, wash your faces and your hands up to the elbows, and wipe your heads, and wash your feet up to the ankles." (Quran 5:6)`,
            postures: [
              { name: 'Intention (Niyyah)', arabic: 'نَوَيْتُ الْوُضُوءَ', transliteration: 'Nawaytul wudū\'a', translation: 'I intend to perform ablution.', tip: 'Make intention silently in your heart.' },
              { name: 'Wash Hands', arabic: 'بِسْمِ اللَّهِ', transliteration: 'Bismillāh', translation: 'In the name of Allah.', tip: 'Wash hands up to wrists three times, starting with the right.' },
              { name: 'Rinse Mouth & Nose', arabic: '—', translation: 'Rinse mouth three times and nose three times with water.', tip: 'Use your right hand to cup water.' },
              { name: 'Wash Face', arabic: '—', translation: 'Wash face from forehead to chin and ear to ear three times.', tip: 'Ensure water reaches all parts of the face.' },
              { name: 'Wash Arms', arabic: '—', translation: 'Wash right arm then left arm up to elbows three times each.', tip: 'Start with the right arm first.' },
              { name: 'Wipe Head & Ears', arabic: '—', translation: 'Wipe the top of the head with wet hands once, then wipe inside and behind ears.', tip: 'Use fresh water for ears.' },
              { name: 'Wash Feet', arabic: '—', translation: 'Wash right foot then left foot up to ankles three times each.', tip: 'Ensure water reaches between toes.' }
            ],
            quiz: [
              { q: 'How many times do you wash each body part in Wudu?', options: ['Once', 'Three times', 'Seven times', 'Ten times'], correct: 1 },
              { q: 'What is the first step of Wudu?', options: ['Wash face', 'Wash hands', 'Intention (Niyyah)', 'Rinse mouth'], correct: 2 },
              { q: 'What breaks Wudu?', options: ['Eating', 'Sleeping', 'Laughing', 'Walking'], correct: 1 }
            ]
          }
        ]},
      { id: 2, title: 'The Opening', subtitle: 'Takbir & Qiyam', icon: '📖', desc: 'Begin your prayer with Takbir and stand before Allah.',
        unlocked: false, lessons: [
          { title: 'Opening of Salah', objectives: ['Learn Takbirat al-Ihram', 'Understand Qiyam', 'Memorize Dua al-Istiftah'],
            content: 'Salah begins with Takbirat al-Ihram — raising your hands and saying "Allahu Akbar" (Allah is the Greatest). This act separates the ordinary from the sacred.',
            postures: [
              { name: 'Takbirat al-Ihram', arabic: 'اللَّهُ أَكْبَرُ', transliteration: 'Allāhu Akbar', translation: 'Allah is the Greatest.', tip: 'Raise hands to ears (men) or shoulders (women). Palms face forward.' },
              { name: 'Qiyam (Standing)', arabic: '—', translation: 'Stand with right hand over left on chest. Recite opening supplication then Surah Al-Fatiha.', tip: 'Focus your gaze on the place of prostration.' }
            ],
            quiz: [
              { q: 'What do you say to begin Salah?', options: ['Bismillah', 'Allahu Akbar', 'Assalamu Alaikum', 'Alhamdulillah'], correct: 1 }
            ]
          }
        ]},
      { id: 3, title: 'The Heart', subtitle: 'Surah Al-Fatiha', icon: '📜', desc: 'The most important chapter — recited in every Rak\'ah.',
        unlocked: false, lessons: [
          { title: 'Mastering Al-Fatiha', objectives: ['Memorize Al-Fatiha', 'Understand its meaning', 'Recite with correct Tajweed'],
            content: 'Surah Al-Fatiha is the essence of the Quran. The Prophet ﷺ said: "There is no Salah for the one who does not recite Al-Fatiha."',
            postures: [
              { name: 'Verse 1', arabic: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', transliteration: 'Bismillāhi r-rahmāni r-rahīm', translation: 'In the name of Allah, the Most Gracious, the Most Merciful.' },
              { name: 'Verse 2', arabic: 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', transliteration: 'Al-ḥamdu lillāhi rabbi l-\'ālamīn', translation: 'All praise is for Allah, Lord of all worlds.' },
              { name: 'Verse 3-4', arabic: 'الرَّحْمَٰنِ الرَّحِيمِ * مَالِكِ يَوْمِ الدِّينِ', transliteration: 'Ar-rahmāni r-rahīm. Māliki yawmi d-dīn', translation: 'The Most Gracious, the Most Merciful. Master of the Day of Judgment.' },
              { name: 'Verse 5', arabic: 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', transliteration: 'Iyyāka na\'budu wa iyyāka nasta\'īn', translation: 'You alone we worship, and You alone we ask for help.' },
              { name: 'Verses 6-7', arabic: 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ * صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ', transliteration: 'Ihdinā ṣ-ṣirāṭa l-mustaqīm. Ṣirāṭa l-laḏīna an\'amta \'alayhim', translation: 'Guide us to the straight path — the path of those You have blessed.' }
            ],
            quiz: [
              { q: 'How many verses are in Surah Al-Fatiha?', options: ['5', '6', '7', '8'], correct: 2 }
            ]
          }
        ]},
      { id: 4, title: 'Movement', subtitle: 'Ruku & Sujood', icon: '🕌', desc: 'Learn the physical postures that express submission to Allah.',
        unlocked: false, lessons: [
          { title: 'Bow & Prostrate', objectives: ['Learn Ruku (bowing)', 'Learn Sujood (prostration)', 'Understand their meanings'],
            content: 'Ruku and Sujood are physical expressions of humility before Allah. The Prophet ﷺ said: "The closest a servant is to his Lord is when he is in prostration."',
            postures: [
              { name: 'Ruku (Bowing)', arabic: 'سُبْحَانَ رَبِّيَ الْعَظِيمِ', transliteration: 'Subḥāna rabbiya l-\'aẓīm', translation: 'Glory be to my Lord, the Most Great.', tip: 'Keep back straight, hands on knees.' },
              { name: 'Standing after Ruku', arabic: 'سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ', transliteration: 'Sami\'a llāhu liman ḥamidah', translation: 'Allah hears those who praise Him.' },
              { name: 'Sujood (Prostration)', arabic: 'سُبْحَانَ رَبِّيَ الْأَعْلَى', transliteration: 'Subḥāna rabbiya l-a\'lā', translation: 'Glory be to my Lord, the Most High.', tip: 'Seven body parts touch the ground.' }
            ],
            quiz: [
              { q: 'How many body parts touch the ground in Sujood?', options: ['5', '7', '9', '3'], correct: 1 },
              { q: 'What is said during Ruku?', options: ['Subhana Rabbiyal A\'la', 'Subhana Rabbiyal Azeem', 'Allahu Akbar', 'Sami Allahu liman hamidah'], correct: 1 }
            ]
          }
        ]},
      { id: 5, title: 'Completion', subtitle: 'Tashahhud & Salam', icon: '🤲', desc: 'Complete your prayer with Tashahhud, Durood, and Salam.',
        unlocked: false, lessons: [
          { title: 'Finishing the Prayer', objectives: ['Memorize Tashahhud', 'Learn Durood', 'Complete with Salam'],
            content: 'The prayer concludes with Tashahhud (testimony of faith), sending blessings on the Prophet ﷺ, and Salam to the right and left.',
            postures: [
              { name: 'Tashahhud', arabic: 'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ', transliteration: 'At-taḥiyyātu lillāhi waṣ-ṣalawātu waṭ-ṭayyibāt', translation: 'All greetings, prayers, and good deeds are for Allah.' },
              { name: 'Durood', arabic: 'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ', transliteration: 'Allāhumma ṣalli \'alā Muḥammad', translation: 'O Allah, send blessings upon Muhammad.' },
              { name: 'Salam', arabic: 'السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ', transliteration: 'As-salāmu \'alaykum wa raḥmatu llāh', translation: 'Peace and mercy of Allah be upon you.' }
            ],
            quiz: [
              { q: 'How many times do you say Salam at the end of prayer?', options: ['Once', 'Twice (right then left)', 'Three times', 'Four times'], correct: 1 }
            ]
          }
        ]}
    ];

    // State
    let completedLessons = JSON.parse(localStorage.getItem('salahLessons') || '[]');
    // Restore unlocked levels from localStorage
    const savedUnlocked = JSON.parse(localStorage.getItem('salahUnlocked') || '[1]');
    levels.forEach(l => { l.unlocked = savedUnlocked.includes(l.id); });
    let quizResults = JSON.parse(localStorage.getItem('salahQuizzes') || '[]');
    let streakData = JSON.parse(localStorage.getItem('salahStreak') || '{"count":0,"last":""}');

    // Functions
    function getCircumference(r) { return 2 * Math.PI * r; }
    function getOffset(pct, r) { const c = getCircumference(r); return c - (pct / 100) * c; }

    function renderLevels() {
      const container = document.getElementById('pyramid-container');
      // Bottom-up order (show 5-1 reverse)
      const reversed = [...levels].reverse();
      // Build pyramid: widest at bottom, narrower at top
      const widths = [95, 85, 75, 65, 55]; // percentages
      container.innerHTML = reversed.map((lvl, i) => {
        const isLocked = !lvl.unlocked;
        const lvlProgress = completedLessons.filter(id => id.level === lvl.id).length || 0;
        const totalLvlLessons = lvl.lessons.length;
        const pct = totalLvlLessons ? Math.round((lvlProgress / totalLvlLessons) * 100) : 0;
        const r = 30, c = getCircumference(r);
        return `<div class="pyramid-card ${isLocked ? 'locked' : ''}" onclick="${isLocked ? '' : `openLevel(${lvl.id})`}" style="width:${widths[i]}%">
          <div class="ring-wrap">
            <svg viewBox="0 0 72 72">
              <circle class="bg" cx="36" cy="36" r="${r}"/>
              <circle class="fg" cx="36" cy="36" r="${r}" style="stroke-dasharray:${c};stroke-dashoffset:${isLocked ? c : getOffset(pct, r)}"/>
            </svg>
            <div class="pct-text">${isLocked ? '🔒' : pct + '%'}</div>
          </div>
          <div class="level-sub">Level ${lvl.id}</div>
          <h3>${lvl.title}</h3>
          <p>${lvl.desc}</p>
          <div class="lessons-count">${lvl.lessons.length} lesson${lvl.lessons.length > 1 ? 's' : ''}</div>
        </div>`;
      }).join('');
    }

    function openLevel(id) {
      const lvl = levels.find(l => l.id === id);
      if (!lvl || !lvl.unlocked) return;
      currentLevelId = id;
      currentLessonIdx = 0;
      currentTab = 'lessons';
      updateModal();
      document.getElementById('modal').classList.add('active');
    }

    let currentLevelId = 1, currentLessonIdx = 0, currentTab = 'lessons';

    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    function switchTab(tab) { currentTab = tab; updateModal(); }

    function updateModal() {
      const lvl = levels.find(l => l.id === currentLevelId);
      if (!lvl) return;
      const lesson = lvl.lessons[currentLessonIdx];
      const body = document.getElementById('modal-body');

      const tabs = ['lessons', 'postures', 'quiz'];
      const tabLabels = ['📖 Lesson', '🧎 Postures', '🧠 Quiz'];

      let html = `<h2>${lvl.title}: ${lesson.title}</h2>
        <p class="modal-desc">${lvl.subtitle} — Level ${lvl.id}</p>
        <div class="lesson-tabs">
          ${tabs.map((t, i) => `<button class="lesson-tab ${currentTab === t ? 'active' : ''}" onclick="switchTab('${t}')">${tabLabels[i]}</button>`).join('')}
        </div>`;

      if (currentTab === 'lessons') {
        html += `<div class="posture-card">
          <h3 style="margin-bottom:12px;">🎯 Learning Objectives</h3>
          <ul style="margin-left:20px;">${lesson.objectives.map(o => `<li style="margin-bottom:8px;color:var(--text-dim);">${o}</li>`).join('')}</ul>
        </div>
        <div class="posture-card">
          <h3 style="margin-bottom:12px;">📝 Content</h3>
          <p style="color:var(--text-dim);line-height:1.7;">${lesson.content}</p>
        </div>`;
      } else if (currentTab === 'postures') {
        html += lesson.postures.map((p, i) => `
          <div class="posture-card">
            <div style="display:flex;gap:16px;align-items:flex-start;">
              <div style="flex-shrink:0;width:80px;">${getPostureSVG(p.image || lesson.image || 'qiyaam')}</div>
              <div style="flex:1;">
                <div class="posture-header">
                  <span class="posture-num">${i+1}</span>
                  <h3>${p.name}</h3>
                </div>
            ${p.transliteration ? `<div class="transliteration">${p.transliteration}</div>` : ''}
            ${p.translation ? `<div class="translation">${p.translation}</div>` : ''}
            ${p.tip ? `<div class="tip-box"><h4>💡 Practice Tip</h4><p>${p.tip}</p></div>` : ''}
            <button class="btn-audio" onclick="reciteArabic('${p.arabic || p.translation || ''}')">🔊 Listen to Recitation</button>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        html += lesson.quiz.map((q, qi) => `
          <div class="quiz-card">
            <p>${q.q}</p>
            <div class="quiz-options">
              ${q.options.map((opt, oi) => `<button class="quiz-opt" onclick="checkQuiz(${qi}, ${oi}, ${q.correct})">${opt}</button>`).join('')}
            </div>
          </div>
        `).join('');
      }

      html += `<div class="lesson-nav">
        <button class="btn btn-secondary" onclick="prevLesson()">← Previous</button>
        <div class="lesson-progress"><div class="fill" style="width:${((currentLessonIdx + 1) / lvl.lessons.length) * 100}%"></div></div>
        <button class="btn btn-primary" onclick="nextLesson()">${currentLessonIdx < lvl.lessons.length - 1 ? 'Next →' : '✅ Complete Level'}</button>
      </div>`;

      body.innerHTML = html;
      updateStats();
    }

    function prevLesson() {
      if (currentLessonIdx > 0) { currentLessonIdx--; currentTab = 'lessons'; updateModal(); }
    }

    function nextLesson() {
      const lvl = levels.find(l => l.id === currentLevelId);
      if (currentLessonIdx < lvl.lessons.length - 1) {
        currentLessonIdx++;
        currentTab = 'lessons';
        updateModal();
      } else {
        // Complete level
        if (!completedLessons.find(l => l.level === currentLevelId)) {
          completedLessons.push({ level: currentLevelId, completedAt: new Date().toISOString() });
          localStorage.setItem('salahLessons', JSON.stringify(completedLessons));
          // Unlock next level
          const next = levels.find(l => l.id === currentLevelId + 1);
          if (next) {
            next.unlocked = true;
            // Persist unlocked levels
            const unlockedIds = levels.filter(l => l.unlocked).map(l => l.id);
            localStorage.setItem('salahUnlocked', JSON.stringify(unlockedIds));
          }
          // Update streak
          const today = new Date().toDateString();
          if (streakData.last !== today) {
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            if (streakData.last === yesterday.toDateString()) streakData.count++;
            else streakData.count = 1;
            streakData.last = today;
            localStorage.setItem('salahStreak', JSON.stringify(streakData));
          }
          renderLevels();
          closeModal();
          updateStats();
          alert(`🎉 Level ${currentLevelId} complete!`);
        } else {
          closeModal();
        }
      }
    }

    let quizAnswered = {};
    function checkQuiz(qi, oi, correct) {
      if (quizAnswered[qi] !== undefined) return;
      quizAnswered[qi] = oi;
      const btns = document.querySelectorAll('.quiz-card')[qi]?.querySelectorAll('.quiz-opt');
      if (btns) {
        btns.forEach((b, i) => {
          b.style.pointerEvents = 'none';
          if (i === correct) b.classList.add('correct');
          else if (i === oi && oi !== correct) b.classList.add('wrong');
        });
      }
      if (oi === correct) {
        quizResults.push(1);
      } else {
        quizResults.push(0);
      }
      localStorage.setItem('salahQuizzes', JSON.stringify(quizResults));
      updateStats();
    }

    // Prayer position SVG file mapping — wudu steps + salah positions
    const postureImages = {
      // Salah positions
      qiyaam: 'images/salah_qiyam.svg',
      takbir: 'images/salah_takbir.svg',
      ruku: 'images/salah_ruku.svg',
      itidal: 'images/salah_itidal.svg',
      sujud: 'images/salah_sujud.svg',
      jalsa: 'images/salah_jalsa.svg',
      tashahhud: 'images/salah_tashahhud.svg',
      salaam: 'images/salah_salaam.svg',
      // Wudu steps
      'wudu-steps': 'images/wudu_niyyah.svg',
      'wudu-niyyah': 'images/wudu_niyyah.svg',
      'wudu-hands': 'images/wudu_hands.svg',
      'wudu-mouth': 'images/wudu_mouth.svg',
      'wudu-nose': 'images/wudu_nose.svg',
      'wudu-face': 'images/wudu_face.svg',
      'wudu-arms': 'images/wudu_arms.svg',
      'wudu-head': 'images/wudu_head.svg',
      'wudu-ears': 'images/wudu_ears.svg',
      'wudu-feet': 'images/wudu_feet.svg',
      'wudu-dua': 'images/wudu_dua.svg'
    };

    function getPostureSVG(image) {
      const src = postureImages[image] || postureImages.qiyaam;
      return `<img src="${src}" alt="${image} position" class="posture-svg" loading="lazy" />`;
    }

    // Load audio manifest for pre-generated recitations
    let salahAudioManifest = null;
    fetch('audio/manifest.json').then(r => r.json()).then(m => { salahAudioManifest = m; }).catch(() => {});

    function findAudioForText(text) {
      if (!salahAudioManifest || !text) return null;
      // Direct match: Arabic text is the manifest key
      if (salahAudioManifest[text]) return salahAudioManifest[text].ar_audio;
      // Partial match: check if text contains a manifest key
      for (const [key, entry] of Object.entries(salahAudioManifest)) {
        if (key.length > 5 && text.includes(key)) return entry.ar_audio;
      }
      // Reverse partial: check if a manifest key contains our text
      for (const [key, entry] of Object.entries(salahAudioManifest)) {
        if (text.length > 5 && key.includes(text)) return entry.ar_audio;
      }
      return null;
    }

    function reciteArabic(text) {
      if (!text || text === '—') return;
      // Find button for visual feedback
      const btn = event && event.target && event.target.closest('.btn-audio');
      if (btn) { btn.classList.add('playing'); btn.textContent = '🔊 Playing...'; }
      const resetBtn = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Listen to Recitation'; } };
      
      // Try pre-generated audio first
      const audioPath = findAudioForText(text);
      if (audioPath) {
        const audio = new Audio(audioPath);
        audio.onended = resetBtn;
        audio.onerror = () => { resetBtn(); speakFallback(text); };
        audio.play().catch(() => { resetBtn(); speakFallback(text); });
      } else {
        speakFallback(text);
      }
    }

    function speakFallback(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA'; u.rate = 0.75;
      const voices = speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang.startsWith('ar'));
      if (arVoice) u.voice = arVoice;
      const btn = event && event.target && event.target.closest('.btn-audio');
      if (btn) { btn.classList.add('playing'); btn.textContent = '🔊 Playing...'; }
      u.onend = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Listen to Recitation'; } };
      u.onerror = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Listen to Recitation'; } };
      speechSynthesis.speak(u);
    }

    function updateStats() {
      document.getElementById('lessons-done').textContent = completedLessons.length;
      const correct = quizResults.filter(v => v).length;
      document.getElementById('quiz-score').textContent = correct;
      document.getElementById('streak').textContent = streakData.count;
    }

    renderLevels();
    updateStats();
  </script>
</body>
</html>
