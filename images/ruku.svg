<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect x="30" y="200" width="200" height="25" rx="4" fill="#d4af37" opacity="0.25"/>
  <!-- Head -->
  <circle cx="50" cy="70" r="20" fill="url(#bodyGrad)"/>
  <ellipse cx="50" cy="58" rx="16" ry="7" fill="#065f46" opacity="0.7"/>
  <!-- Back (flat, horizontal) -->
  <path d="M68 82 Q100 78 180 82 L180 96 Q100 92 68 96 Z" fill="url(#bodyGrad)"/>
  <!-- Arms reaching down to knees -->
  <path d="M170 88 Q185 100 185 130" stroke="url(#bodyGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M180 88 Q195 100 195 130" stroke="url(#bodyGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Hands on knees -->
  <ellipse cx="190" cy="138" rx="10" ry="6" fill="#047857"/>
  <!-- Legs (straight) -->
  <path d="M170 96 L168 190 L178 190 L180 96" fill="url(#bodyGrad)"/>
  <path d="M182 96 L180 190 L190 190 L192 96" fill="url(#bodyGrad)"/>
  <ellipse cx="173" cy="198" rx="8" ry="5" fill="#047857"/>
  <ellipse cx="186" cy="198" rx="8" ry="5" fill="#047857"/>
  <text x="130" y="232" text-anchor="middle" fill="#065f46" font-family="Inter,sans-serif" font-size="14" font-weight="600">Ruku (Bowing)</text>
</svg>